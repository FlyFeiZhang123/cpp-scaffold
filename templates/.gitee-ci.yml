# 编译 + 测试，push 自动触发
version: '1.0'
name: CI

triggers:
  push:
    branches:
      include:
        - .*
  pull_request:
    branches:
      include:
        - .*

stages:
  - name: build
    displayName: 编译与测试
    steps:
      - step: build
        name: build-test
        displayName: 编译测试
        runtime:
          image: ubuntu:22.04
        commands:
          - apt-get update && apt-get install -y gcc g++ cmake ninja-build
          - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=OFF
          - ninja -C build
          - cd build && ctest --output-on-failure

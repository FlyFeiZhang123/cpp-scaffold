name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: "${{ matrix.compiler }} | ${{ matrix.sanitizer }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [ASan, UBSan, None]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libpfm4-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y -qq clang
          fi

      - name: Setup compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc"     >> $GITHUB_ENV
            echo "CXX=g++"    >> $GITHUB_ENV
          fi

      - name: Generate test project from scaffold
        run: |
          export BASE_SETTINGS_DIR="${{ github.workspace }}"
          mkdir /tmp/test_project
          cd /tmp/test_project
          bash "$BASE_SETTINGS_DIR/install.bash" test_project test_app

      # 这里以前是手搓 cmake + ctest，绕过了 my_build.bash —— 而 build/app、
      # build/test、build/bench 三个软链接正是 my_build.bash 建的。后果是
      # build/test 从早年版起就没被生成过，一直没人发现。现在全程走用户真正
      # 会敲的那条命令，并断言产物真的存在。
      - name: Build + Test (my_build.bash)
        working-directory: /tmp/test_project
        run: |
          case "${{ matrix.sanitizer }}" in
            ASan)  ./my_build.bash debug asan    test ;;
            UBSan) ./my_build.bash debug no-asan ubsan test ;;
            None)  ./my_build.bash debug no-asan test ;;
          esac
          test -x build/app
          test -x build/test
          test -x build/bench
          test -e build/compile_commands.json

  # 与上面的矩阵互补：矩阵管 gcc/clang × 消毒剂组合，这个管「整套流程按用户的
  # 用法从头跑一遍」—— 生成、编译、软链接、ctest 用例数、task_tracker、
  # update.bash 的 A/B/C 承诺，全在 scripts/scaffold_test.bash 里断言。
  scaffold:
    name: "脚手架自测"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libpfm4-dev

      - name: Run scaffold self-test
        run: ./scripts/scaffold_test.bash

  # 矩阵管 gcc/clang × 消毒剂，scaffold 管整套流程 —— 但两者都没装 conan，于是
  # newproj 的 y 参数（生成 conanfile.txt）和 my_build.bash 的 conan 工具链这条路径
  # 在 CI 里从来是死的：conanfile.txt 生成了没人消化，工具链一次没建过。这不是故意
  # 跳过，而是「本机装了 conan 所以本地能跑、CI 没装所以跑不到」的盲区。
  #
  # 这个 job 装 conan 并把脚手架自测跑一遍，让 scaffold_test.bash 第 5 节真的执行。
  # 它钉住的是一个隐式契约：my_build.bash 写死 build/Debug/generators/ —— 大写
  # Debug 来自 Conan 的 cmake_layout，与构建目录 build/debug-asan 故意不一致。
  # 两腿并行，墙钟成本为零；clang 腿另有价值：conan profile detect 会读 CC/CXX。
  conan:
    name: "conan | ${{ matrix.compiler }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libpfm4-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y -qq clang
          fi

      - name: Setup compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc"     >> $GITHUB_ENV
            echo "CXX=g++"    >> $GITHUB_ENV
          fi

      # 走仓库自己的安装脚本（顺带把 scripts/conan_install.bash 也验了 —— 它此前
      # 没有任何测试）。conan 落在 ~/.local/bin，该目录默认不在 CI 的 PATH 上，而
      # my_build.bash 靠 `command -v conan` 决定走不走 conan —— 漏了 GITHUB_PATH
      # 就会静默跳过整条分支，测试照样绿。所以下面两行都不能省。
      - name: Install conan
        run: |
          ./scripts/conan_install.bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"   # GITHUB_PATH 下一个 step 才生效
          conan --version

      - name: Run scaffold self-test (含 Conan 集成)
        run: ./scripts/scaffold_test.bash

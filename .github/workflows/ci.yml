name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: "${{ matrix.compiler }} | ${{ matrix.sanitizer }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [ASan, UBSan, None]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libpfm4-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y -qq clang
          fi

      - name: Setup compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc"     >> $GITHUB_ENV
            echo "CXX=g++"    >> $GITHUB_ENV
          fi

      - name: Generate test project from scaffold
        run: |
          export BASE_SETTINGS_DIR="${{ github.workspace }}"
          mkdir /tmp/test_project
          cd /tmp/test_project
          bash "$BASE_SETTINGS_DIR/install.bash" test_project test_app

      - name: CMake configure
        run: |
          SAN_FLAGS=""
          case "${{ matrix.sanitizer }}" in
            ASan)  SAN_FLAGS="-DENABLE_ASAN=ON  -DENABLE_TSAN=OFF -DENABLE_UBSAN=OFF" ;;
            UBSan) SAN_FLAGS="-DENABLE_ASAN=OFF -DENABLE_TSAN=OFF -DENABLE_UBSAN=ON"  ;;
            None)  SAN_FLAGS="-DENABLE_ASAN=OFF -DENABLE_TSAN=OFF -DENABLE_UBSAN=OFF" ;;
          esac
          cd /tmp/test_project
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=$CC   \
            -DCMAKE_CXX_COMPILER=$CXX \
            $SAN_FLAGS \
            .

      - name: Build
        working-directory: /tmp/test_project
        run: cmake --build build

      - name: Test
        working-directory: /tmp/test_project
        run: cd build && ctest --output-on-failure

# base_settings 自检
# 验证：语法检查 → 生成项目 → 编译 → 测试
version: '1.0'
name: CI
displayName: 脚手架自检

triggers:
  trigger: auto

stages:
  - name: lint
    displayName: 语法检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@gcc
        name: lint
        displayName: bash 语法与静态检查
        commands:
          - apt-get update && apt-get install -y shellcheck
          - find . -name '*.bash' -exec bash -n {} \;
          - find . -name '*.bash' -exec shellcheck {} \;
        strategy:
          retry: "0"

  - name: verify
    displayName: 模板验证
    strategy: naturally
    trigger: auto
    steps:
      - step: build@gcc
        name: gen
        displayName: 生成项目并编译测试
        commands:
          - apt-get update && apt-get install -y gcc g++ cmake ninja-build
          - ./install.bash test_proj test_app n v
          - cd test_proj && ./my_build.bash debug no-asan
          - cd test_proj && ./my_build.bash test no-asan debug
        strategy:
          retry: "0"
